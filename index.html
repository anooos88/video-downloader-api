<!DOCTYPE html>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VideoDown - تحميل الفيديوهات</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #1f2937, transparent 40%),
        linear-gradient(135deg, #0f172a, #020617);
      color: white;
      min-height: 100vh;
    }

    header {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    .logo span {
      color: #38bdf8;
    }

    .language-btn {
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.08);
      color: white;
      padding: 9px 15px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      transition: .2s;
    }

    .language-btn:hover {
      background: rgba(255,255,255,.15);
      transform: translateY(-1px);
    }

    .container {
      width: 92%;
      max-width: 760px;
      margin: 60px auto;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #94a3b8;
      margin-bottom: 35px;
      font-size: 16px;
    }

    .download-box {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      padding: 25px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }

    .url-input {
      width: 100%;
      padding: 17px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.25);
      color: white;
      outline: none;
      font-size: 16px;
      direction: ltr;
    }

    .url-input:focus {
      border-color: #38bdf8;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 15px;
    }

    .quality {
      flex: 1;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: #111827;
      color: white;
      font-size: 15px;
      outline: none;
    }

    .download-btn {
      flex: 2;
      border: none;
      border-radius: 12px;
      padding: 15px;
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    .download-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 25px rgba(37,99,235,.3);
    }

    .download-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .loading {
      display: none;
      margin-top: 25px;
    }

    .spinner {
      width: 35px;
      height: 35px;
      border: 4px solid rgba(255,255,255,.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .message {
      margin-top: 20px;
      padding: 14px;
      border-radius: 12px;
      display: none;
      font-size: 14px;
    }

    .message.success {
      display: block;
      background: rgba(34,197,94,.12);
      border: 1px solid rgba(34,197,94,.25);
      color: #86efac;
    }

    .message.error {
      display: block;
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.25);
      color: #fca5a5;
    }
